services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: seat_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat_user -d seat_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://seat_user:local_password@postgres:5432/seat_reservation?sslmode=disable
      AUTH_JWT_SECRET: local-development-secret-change-me
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: